    <script>
        $(".nav-menu-search").click(function () {
            $(".nav-search").addClass("block");
        });
        $(document).scroll(function () {
            var H = $(document).scrollTop();
            if (H > 20) {
                $(".header-content").addClass("header-bg");
            } else {
                $(".header-content").removeClass("header-bg");
            }
            if (H > 140) {
                $(".header-content").addClass("header-bg");
                $(".search-dh").append($(".search-box"));
                $(".nav-menu-search").click(function () {
                    $(".nav-search").addClass("block");
                });
            } else {
                $(".header-content").removeClass("header-bg");
                $(".search-main").append($(".search-box"));

            }
        });

        // 浏览记录 
        setTimeout(() => {
            if (localStorage.getItem('visit')) {
                const hlHistory = document.querySelector('#history');
                const arr = JSON.parse(localStorage.getItem('visit'));
                let strDom = `<li class="list-item list-item-title"><a href="javascript:;" class="playlist historyclean" ><i class="icon-clear" onclick="removeLocal();"></i></a><strong>我的观影记录</strong></li>`;

                arr.forEach(item => {
                    strDom = strDom + ` <li class="list-item">
                    <a title="${item.name}" href="${item.url}" class="list-item-link"><i class="icon-play"></i><span class="cmsSpan">${item.tag}</span>${item.name}</a>
                </li>`
                });
                hlHistory.innerHTML = strDom;
            }

        }, 1000)
        //清理浏览记录
        function removeLocal() {
            localStorage.clear('visit');
            const hlHistory = document.querySelector('#history');
            hlHistory.innerHTML = '<li class="list-item list-item-title"><a href="javascript:;" class="playlist historyclean" ><i class="icon-clear" onclick="removeLocal();"></i></a><strong>我的观影记录</strong></li>';
        }
    </script>
